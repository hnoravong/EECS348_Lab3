<!DOCTYPE html>
<html>
<head>
<style>
  #myPara {
    border-style: solid;
    padding: 10px;
  }
</style>
</head>
<body>
  <p id="myPara">This is some dummy text for styling.</p>

  R: <input type="text" id="r" size="3">
  G: <input type="text" id="g" size="3">
  B: <input type="text" id="b" size="3">
  Border width (px): <input type="text" id="bw" size="3">
  <button onclick="applyStyle()">Apply</button>

  <script>
    function applyStyle() {
      var r = document.getElementById("r").value;
      var g = document.getElementById("g").value;
      var b = document.getElementById("b").value;
      var bw = document.getElementById("bw").value;
      var color = "rgb(" + r + "," + g + "," + b + ")";
      var para = document.getElementById("myPara");
      para.style.color = color;
      para.style.borderColor = color;
      para.style.borderWidth = bw + "px";
    }
  </script>
</body>
</html>
